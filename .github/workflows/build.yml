name: Build WinKoKo Tunnel APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;25.2.9519653"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then gradle wrapper --gradle-version 8.5; fi
      - name: Grant wrapper permission
        run: chmod +x ./gradlew
      - name: Prepare stable release signing
        if: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/winkoko-release.jks"
          {
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/winkoko-release.jks"
            echo "SIGNING_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}"
            echo "SIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}"
            echo "SIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
      - name: Rename APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/*universal*.apk artifacts/WinKoKo-Tunnel-debug.apk
          if [ -n "${SIGNING_KEYSTORE_PATH:-}" ]; then
            cp app/build/outputs/apk/release/*universal*.apk artifacts/WinKoKo-Tunnel-release.apk
          else
            cp app/build/outputs/apk/release/*universal*.apk artifacts/WinKoKo-Tunnel-release-unsigned.apk
          fi
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinKoKo-Tunnel-APKs
          path: artifacts/*.apk
          retention-days: 30
